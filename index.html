<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f3">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>TOTP 计算器</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1><span translate="no">TOTP</span> <span>计算器</span></h1>
    </header>

    <section class="card" aria-label="生成验证码">
      <div class="field-heading">
        <label for="secret" lang="en">TOTP Secret Key</label>
        <button id="clear" class="text-button" type="button" disabled>清空</button>
      </div>
      <span id="secret-hint" class="visually-hidden">格式为 Base32。</span>
      <input id="secret" name="secret" type="text" autocomplete="off" autocapitalize="off" autocorrect="off"
        spellcheck="false" maxlength="4096" placeholder="粘贴 Base32 密钥"
        aria-describedby="secret-hint error privacy" disabled>
      <p id="error" class="error" role="status"></p>

      <div class="readout">
        <div class="code-cell">
          <output id="code" aria-label="动态验证码" aria-live="off" translate="no"></output>
        </div>
        <button id="copy" class="primary" type="button" disabled>复制</button>
        <div class="timer">
          <progress id="progress" aria-label="当前验证码剩余时间" max="30" value="0"></progress>
          <div class="timer-ticks" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
        <span id="remaining"></span>
      </div>
      <p id="feedback" class="feedback" role="status"></p>
    </section>
    <footer>
      <p id="privacy">密钥仅在本页处理，不上传、不保存。</p>
      <span class="version">v0.1.4</span>
    </footer>
  </main>
</body>
</html>
